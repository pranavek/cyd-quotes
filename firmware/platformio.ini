; ESP32 CYD Quote Viewer
; Board: ESP32-2432S028R (Cheap Yellow Display)
; Display: ILI9341 320x240, Touch: XPT2046

[env:esp32-cyd]
platform = espressif32 @ ^6.6.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; min_spiffs gives 1.9 MB app partition on 4 MB flash — no filesystem needed
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ ^8.3.11
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#1.4
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    ; Tell TFT_eSPI to use our include/User_Setup.h instead of its own default
    -DUSER_SETUP_LOADED
    ; Tell LVGL to resolve lv_conf.h from the compiler include path (include/)
    -DLV_CONF_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=0
    -O2
